<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>POCKETPD — PC-98 ANALOG UI 提案 V2</title>
<style>
  @font-face{font-family:'PD98LAT';src:url('fonts/pd98-latin.woff2') format('woff2')}

  body{background:#04040C;color:#C8C8D8;font-family:'PD98LAT','PD98UI',Consolas,monospace;margin:0;padding:32px}
